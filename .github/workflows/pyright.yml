name:  Pyright Action

on:
  push:
    paths:
        - "**.py"

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: jakebailey/pyright-action@v3
        with:
          extra-args: src