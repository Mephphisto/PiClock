name: Ruff

on:
  push:
    paths:
      - "**.py"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - uses: astral-sh/ruff-action@v3
      with:
        args: check src
        src: src