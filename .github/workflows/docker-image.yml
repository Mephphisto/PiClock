name: Docker Image CI
on:
  workflow_run:
    workflows: ["Ruff", "Pyright", "Hadolint"]
    types: [completed]
    branches: [ "main" ]
  push:
    tags: [ "v*.*.*" ]          # stable releases, e.g. v1.2.3
  workflow_dispatch:

# If two lint workflows finish at the same time, only one build survives
concurrency:
  group: docker-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # quick filter: a tag push, a manual run, or the triggering lint run passed
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read            # needed for `gh run list`
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # tag pushes always build
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # the latest run of every lint workflow on main must be green
        for wf in Ruff Pyright Hadolint; do
          c=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main \
               --limit 1 --json conclusion -q '.[0].conclusion')
          echo "$wf: ${c:-<none>}"
          if [ "$c" != "success" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
        done
        echo "ok=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to GHCR
    steps:
    - uses: actions/checkout@v6
      with:
        # build the exact commit that was linted; on a tag push this
        # falls back to the tag's own commit
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase the image name
      id: image
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Extract tags / labels
      id: meta
      uses: docker/metadata-action@v5
      with:
        # on workflow_run, read the SHA from the checked-out commit
        context: ${{ github.event_name == 'workflow_run' && 'git' || 'workflow' }}
        images: ${{ steps.image.outputs.name }}
        tags: |
          type=raw,value=latest,enable=${{ github.event_name != 'push' }}
          type=sha,enable=${{ github.event_name != 'push' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=stable,enable=${{ github.event_name == 'push' }}

    - name: Build and push the Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}